name: Prepare offline bundle resources
description: >-
  Download and verify the Node.js runtime, the packaged dsh core and pnpm, then
  stage them **as-is** (the upstream archives) under src-tauri/resources. The
  application unpacks them into app data on first launch, so the installer ships
  no expanded runtime tree and never has to write into its own install
  directory.

inputs:
  platform:
    description: Target platform (windows | macos | linux)
    required: true
  arch:
    description: Target architecture (x64 | arm64)
    required: true
  dsh-tag:
    description: deepseek-harness-pkg release tag bundled as the built-in core
    required: true
  bundle-git:
    description: >-
      Also bundle MinGit. Off by default: starting dsh needs no Git, only
      git-backed features (worktree, `github:` plugins) do, and an offline
      machine can never provision it afterwards.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Download and stage bundled archives
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        ARCH: ${{ inputs.arch }}
        DSH_TAG: ${{ inputs.dsh-tag }}
        BUNDLE_GIT: ${{ inputs.bundle-git }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        with_git=false
        if [ "$PLATFORM" = "windows" ] && [ "$BUNDLE_GIT" = "true" ]; then
          with_git=true
        fi
        git_flag=""
        [ "$with_git" = "true" ] && git_flag="--with-git"

        workdir="$(mktemp -d)"
        trap 'rm -rf "$workdir"' EXIT

        sha256_of() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }

        fetch() {
          local url="$1" out="$2" attempt
          for attempt in 1 2 3 4; do
            if curl -fL --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 7200 -o "$out" "$url"; then
              return 0
            fi
            echo "download failed (attempt ${attempt}/4): ${url}"
            sleep 10
          done
          echo "::error::failed to download ${url}"
          return 1
        }

        verify() {
          local file="$1" expected="$2" label="$3" actual
          if [ -z "$expected" ]; then
            echo "::error::no trusted SHA-256 available for ${label}"
            return 1
          fi
          actual="$(sha256_of "$file")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::${label} SHA-256 mismatch: expected ${expected}, got ${actual}"
            return 1
          fi
          echo "${label} SHA-256 verified"
        }

        # 离线包只随包压缩包：按资产名原样落盘，运行期由
        # `config::runtime::bundled_archive_filename` 按同一套常量推导出同一个文件名。
        stage() {
          local from="$1" name="$2"
          mkdir -p src-tauri/resources
          mv -f "$from" "src-tauri/resources/$name"
        }

        # 刻意不用关联数组：macOS runner 的 /bin/bash 是 3.2（`declare -A` 需要 bash 4），
        # 而 `shell: bash` 会解析到它，用了会让 macOS 离线包构建在下载前就失败。
        while IFS='|' read -r key name url sha sha_url; do
          [ -n "${key:-}" ] || continue
          case "$key" in
            node) node_name="$name"; node_url="$url"; node_sha_url="$sha_url" ;;
            dsh) dsh_name="$name"; dsh_url="$url" ;;
            pnpm) pnpm_name="$name"; pnpm_url="$url"; pnpm_sha="$sha" ;;
            git) git_name="$name"; git_url="$url"; git_sha="$sha" ;;
          esac
        done < <(node scripts/bundle-metadata.mjs --assets --platform "$PLATFORM" --arch "$ARCH" $git_flag)

        # Node.js 运行时：摘要取自官方 SHASUMS256.txt，与 assets 同源同版本。
        fetch "$node_url" "${workdir}/${node_name}"
        fetch "$node_sha_url" "${workdir}/SHASUMS256.txt"
        verify "${workdir}/${node_name}" \
          "$(awk -v asset="${node_name}" '$2 == asset { print $1 }' "${workdir}/SHASUMS256.txt")" \
          "Node.js ${node_name}"
        stage "${workdir}/${node_name}" "$node_name"

        # dsh 内核：摘要来自同一 release 的 GitHub API，缺失即中止（无法校验完整性的
        # 内容不进离线包）。
        fetch "$dsh_url" "${workdir}/${dsh_name}"
        dsh_digest="$(gh api "repos/dsh-tauri-desk/deepseek-harness-pkg/releases/tags/${DSH_TAG}" \
          --jq ".assets[] | select(.name == \"${dsh_name}\") | .digest" 2>/dev/null \
          | sed 's/^sha256://' | head -n 1)"
        verify "${workdir}/${dsh_name}" "$dsh_digest" "dsh core ${dsh_name}"
        stage "${workdir}/${dsh_name}" "$dsh_name"

        # pnpm：纯 JS 发行，摘要取自 constants.rs 的固定值。
        fetch "$pnpm_url" "${workdir}/${pnpm_name}"
        verify "${workdir}/${pnpm_name}" "$pnpm_sha" "pnpm ${pnpm_name}"
        stage "${workdir}/${pnpm_name}" "$pnpm_name"

        # MinGit：默认不随包（`bundle-git: true` 才下载）。启动 dsh 不需要 Git，
        # 只有 git 托管的能力（worktree、`github:` 插件）依赖它。
        if [ -n "${git_name:-}" ]; then
          fetch "$git_url" "${workdir}/${git_name}"
          verify "${workdir}/${git_name}" "$git_sha" "MinGit ${git_name}"
          stage "${workdir}/${git_name}" "$git_name"
        fi

    - name: Verify staged archives
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        ARCH: ${{ inputs.arch }}
        DSH_TAG: ${{ inputs.dsh-tag }}
        BUNDLE_GIT: ${{ inputs.bundle-git }}
      run: |
        set -euo pipefail

        with_git=false
        if [ "$PLATFORM" = "windows" ] && [ "$BUNDLE_GIT" = "true" ]; then
          with_git=true
        fi
        git_flag=""
        [ "$with_git" = "true" ] && git_flag="--with-git"

        workdir="$(mktemp -d)"
        trap 'rm -rf "$workdir"' EXIT

        extract() {
          local archive="$1" dest="$2"
          mkdir -p "$dest"
          case "$archive" in
            *.zip)
              # Windows 的 Git Bash 不一定带 unzip；Windows 10+ 自带的 bsdtar 能解 zip。
              if command -v unzip >/dev/null 2>&1; then
                (cd "$dest" && unzip -q "$archive")
              else
                (cd "$dest" && tar -xf "$archive")
              fi
              ;;
            *)
              (cd "$dest" && tar -xzf "$archive")
              ;;
          esac
        }

        # 与 Rust `download::utils::flatten_directory` 一致：解压结果只有唯一一层
        # 子目录时把内容上提，保证运行时根就是预期的那一层。
        flatten() {
          local dir="$1" entries=()
          while IFS= read -r entry; do entries+=("$entry"); done < <(find "$dir" -mindepth 1 -maxdepth 1)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            shopt -s dotglob
            mv "${entries[0]}"/* "$dir"/
            shopt -u dotglob
            rmdir "${entries[0]}"
          fi
        }

        # 入口路径必须与清单 `dependencies.<key>.entry` 一致：解压层级或资产布局变化
        # 会让应用在启动时判定「依赖缺失」并转去联网下载。校验在临时目录里解压完成，
        # 安装包内只保留压缩包。
        check_entry() {
          local key="$1" archive="$2" entry="$3" dir="${workdir}/check-${1}"
          rm -rf "$dir"
          extract "$archive" "$dir"
          flatten "$dir"
          if [ ! -e "${dir}/${entry}" ]; then
            echo "::error::bundled entry is missing after unpacking ${key}: ${entry}"
            return 1
          fi
          echo "${key} archive unpacks to ${entry}"
        }

        while IFS='|' read -r key name url sha sha_url; do
          [ -n "${key:-}" ] || continue
          archive="src-tauri/resources/${name}"
          if [ ! -f "$archive" ]; then
            echo "::error::bundled archive is missing: ${archive}"
            exit 1
          fi
          case "$key" in
            node) entry="bin/node"; [ "$PLATFORM" = "windows" ] && entry="node.exe" ;;
            pnpm) entry="bin/pnpm.cjs" ;;
            dsh) entry="node_modules/@deepseek-ai/dsh/lib/bin.js" ;;
            git) entry="cmd/git.exe" ;;
            *) echo "::error::unknown bundled key ${key}"; exit 1 ;;
          esac
          check_entry "$key" "$archive" "$entry"
        done < <(node scripts/bundle-metadata.mjs --assets --platform "$PLATFORM" --arch "$ARCH" $git_flag)

        # 解压后的运行时树不得进安装包：那正是这次要消掉的体积。
        for legacy in node pnpm dsh git; do
          if [ -d "src-tauri/resources/$legacy" ]; then
            echo "::error::extracted runtime tree must not be bundled: src-tauri/resources/$legacy"
            exit 1
          fi
        done

        # 托管根必须留在 AppData（已废弃的 `$Resources/...` 不再出现在清单里）
        grep -q '"managedRoot": "\$AppData/' src-tauri/resources/manifest.jsonc
        ! grep -q '"\$Resources/' src-tauri/resources/manifest.jsonc
        echo "--- bundled archives ---"
        du -sh src-tauri/resources/*.zip src-tauri/resources/*.tgz src-tauri/resources/*.tar.gz 2>/dev/null || true
        sed -n '/"dependencies"/,/^  }/p' src-tauri/resources/manifest.jsonc
